<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2f1f4">
<title>The Game — دنیای بازی‌ها</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5/index.css">
<style>
:root{--bg:#f3f2f6;--panel:#fff;--soft:#f6f5f8;--text:#26252a;--muted:#969299;--line:#f0eef2;--accent:#6d4fc4;--accent-2:#b464c8;--shadow:0 4px 45px #29212f02;--danger:#dc2626;--success:#16a34a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e8e6eb;color:var(--text);font:14px Vazirmatn,Tahoma,sans-serif;min-height:100vh;transition:background .3s,color .3s;padding-bottom:0}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:0;background:transparent;color:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
button{transition:background .2s,transform .2s,box-shadow .2s}
button:active{transform:scale(.96)}
svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.shell{width:calc(100% - 72px);max-width:1280px;min-height:calc(100vh - 80px);margin:40px auto;padding:22px 30px 18px;border:1px solid #ffffff80;border-radius:38px;background:var(--bg);display:grid;grid-template-columns:42px minmax(0,1fr);gap:0 26px;align-content:start;box-shadow:var(--shadow)}

header{grid-column:1/-1;display:flex;align-items:center;gap:22px;margin-bottom:30px;min-height:48px}
.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;min-width:126px}
.brand-icon{display:grid;place-items:center;width:38px;height:38px;background:linear-gradient(135deg,#6d4fc4,#b464c8);border-radius:12px;color:#fff;font-size:20px;font-weight:800;box-shadow:inset 0 0 0 3px #ffffff40,0 4px 12px #6d4fc440}
nav{background:var(--panel);padding:5px;display:flex;border-radius:40px;gap:1px;margin-inline:auto;box-shadow:0 1px 0 #fff5;align-items:center}
nav a{padding:9px 17px;font-size:11px;line-height:22px;font-weight:400;border-radius:30px;white-space:nowrap;transition:.25s;position:relative}
nav a.active{background:#28272c;box-shadow:0 4px 7px #1b182d1a;color:#fff}
nav a.active:after{content:'';width:4px;height:4px;position:absolute;bottom:4px;left:calc(50% - 2px);background:#f1eeee;border-radius:50%;opacity:.7}
nav a:hover:not(.active){background:var(--soft)}

.hamburger{display:none;width:38px;height:38px;border-radius:10px;background:var(--panel);align-items:center;justify-content:center;color:var(--text)}
.hamburger svg{width:20px;height:20px}

.mobile-menu{display:none;position:fixed;inset:0;background:#00000060;backdrop-filter:blur(8px);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.mobile-menu.open{opacity:1;pointer-events:auto}
.mobile-menu-inner{position:absolute;top:0;right:0;width:280px;height:100%;background:var(--panel);padding:24px 20px;transform:translateX(100%);transition:transform .3s;overflow-y:auto}
.mobile-menu.open .mobile-menu-inner{transform:translateX(0)}
.mobile-menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.mobile-menu-head b{font-size:14px;font-weight:700}
.mobile-menu-close{width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center}
.mobile-menu a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;font-size:13px;margin-bottom:4px;transition:.2s}
.mobile-menu a:hover,.mobile-menu a.active{background:var(--soft);color:var(--accent)}
.mobile-menu a svg{width:18px;height:18px}

.header-tools{background:var(--panel);display:flex;border-radius:30px;padding:7px 8px;gap:4px}
.icon-btn{width:29px;height:29px;display:grid;place-items:center;background:transparent;border-radius:50%;color:#8d8991;position:relative;transition:.2s}
.icon-btn:hover{background:var(--line);color:var(--text)}
.icon-btn svg{width:17px;height:17px;stroke-width:1.55}
.dot:after{content:'';position:absolute;width:5px;height:5px;background:var(--accent);border-radius:50%;top:6px;right:7px;border:1.5px solid var(--panel)}

.profile{display:flex;align-items:center;text-align:right;gap:9px;background:var(--panel);border-radius:28px;padding:6px 9px 6px 14px;min-width:194px;height:46px}
.profile b{font-size:11px;font-weight:600;display:block}
.profile small{font-size:9px;color:#aaa5ae;display:block;margin-top:1px}
.profile .avatar{width:32px;height:32px;display:grid;place-items:center;background:linear-gradient(145deg,#6d4fc4,#b464c8);color:#fff;border:3px solid #eee9e6;border-radius:50%;font-size:13px;font-weight:700}
.profile>span:last-child{margin-right:auto;width:16px;display:grid;place-items:center}
.profile>span:last-child svg{width:14px;stroke:#b7b2bc}

aside{display:flex;flex-direction:column;gap:66px;padding-top:3px;align-items:center}
.rail-group{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 3px;background:var(--panel);border-radius:26px;width:40px}
.rail-group a,.rail-group button{display:grid;place-items:center;height:35px;width:32px;border-radius:15px;color:#918c96;transition:.25s}
.rail-group a svg,.rail-group button svg{height:17px;width:17px;stroke-width:1.6}
.rail-group a.active,.rail-group button.active{background:transparent;color:#38333c}
.rail-group a:hover,.rail-group button:hover{background:#f2eff3;color:var(--accent)}
.rail-bottom{margin-top:auto;margin-bottom:3px}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 6px;z-index:90;box-shadow:0 -4px 20px #00000010}
.bottom-nav-inner{display:flex;justify-content:space-around;align-items:center;max-width:500px;margin:0 auto}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:12px;color:var(--muted);font-size:9px;transition:.2s;min-width:56px}
.bottom-nav a svg{width:20px;height:20px}
.bottom-nav a.active{color:var(--accent);background:var(--soft)}

main{min-width:0}
.page-heading{display:flex;justify-content:space-between;align-items:center;margin:0 0 28px;min-height:72px;gap:24px}
h1{font-size:32px;font-weight:600;letter-spacing:-1.1px;line-height:1.55;margin:0 0 3px}
.page-heading p{font-size:11px;line-height:1.8;color:#96919b;margin:0;max-width:400px}
.page-heading .primary{align-self:center;margin-top:21px}

.primary{display:flex;gap:7px;align-items:center;justify-content:center;background:#26252b;color:#fff;padding:10px 17px;border-radius:28px;font-size:11px;font-weight:400;box-shadow:0 4px 7px #24202c16;min-height:38px;transition:.25s}
.primary:hover{background:#413a3d;transform:translateY(-2px);box-shadow:0 7px 14px #26252b20}
.primary svg{height:13px;width:13px;stroke:#d7d2dc;stroke-width:1.4}

.panel{background:var(--panel);padding:21px;border-radius:22px;box-shadow:none;min-width:0;animation:enter .45s cubic-bezier(.2,.7,.25,1) both}
.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px;min-height:20px}
.panel-title h2{font-size:13px;font-weight:600;line-height:1.5}
.muted{color:var(--muted);font-size:11px}
.badge{font-size:9px;border-radius:5px;background:#edf0f9;color:#5e78b8;padding:3px 9px;line-height:1.5}

.hero{position:relative;height:280px;border-radius:22px;overflow:hidden;margin-bottom:20px;background:linear-gradient(120deg,#2a1f4a 0%,#6d4fc4 50%,#b464c8 100%);display:flex;align-items:flex-end;padding:28px;color:#fff;animation:enter .5s both}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,#ffffff20,transparent 50%),radial-gradient(circle at 20% 80%,#00000030,transparent 50%)}
.hero-content{position:relative;z-index:2;max-width:520px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:#ffffff20;backdrop-filter:blur(10px);padding:5px 12px;border-radius:20px;font-size:10px;margin-bottom:14px;border:1px solid #ffffff30}
.hero h2{font-size:28px;font-weight:700;line-height:1.4;margin-bottom:10px;letter-spacing:-.5px}
.hero p{font-size:12px;line-height:1.9;opacity:.9;margin-bottom:18px}
.hero-actions{display:flex;gap:8px}
.hero-btn{background:#fff;color:#26252a;padding:9px 18px;border-radius:22px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.hero-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #00000030}
.hero-btn.ghost{background:#ffffff20;color:#fff;backdrop-filter:blur(10px);border:1px solid #ffffff30}
.hero-meta{position:absolute;top:24px;left:24px;z-index:2;display:flex;gap:8px}
.hero-tag{background:#ffffff20;backdrop-filter:blur(10px);padding:5px 11px;border-radius:14px;font-size:10px;border:1px solid #ffffff25}

.ad-banners{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.ad-banner{position:relative;height:130px;border-radius:18px;overflow:hidden;cursor:pointer;transition:.3s;animation:enter .5s both;background-size:cover;background-position:center}
.ad-banner:hover{transform:translateY(-4px);box-shadow:0 14px 30px #29212f25}
.ad-banner::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,#00000070,transparent 70%);z-index:1}
.ad-banner::after{content:'AD';position:absolute;top:10px;left:10px;background:#ffffff20;backdrop-filter:blur(8px);color:#fff;font-size:9px;padding:3px 8px;border-radius:8px;z-index:3;border:1px solid #ffffff20;letter-spacing:1px}
.ad-content{position:absolute;bottom:14px;right:16px;left:16px;z-index:2;color:#fff}
.ad-content h3{font-size:16px;font-weight:700;margin-bottom:4px;line-height:1.3;letter-spacing:-.3px}
.ad-content p{font-size:10px;opacity:.9;line-height:1.5}
.ad-banner .ad-deco{position:absolute;top:14px;right:14px;font-size:52px;font-weight:900;opacity:.15;color:#fff;z-index:1;letter-spacing:-3px;line-height:1}
.ad-1{background:linear-gradient(135deg,#1a0f2e 0%,#4a2c6d 50%,#8b5cf6 100%)}
.ad-2{background:linear-gradient(135deg,#0c1929 0%,#1e3a5f 50%,#3b82f6 100%)}
.ad-3{background:linear-gradient(135deg,#2d1810 0%,#7c2d12 50%,#ea580c 100%)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:20px}
.stat{padding:22px}
.stat-label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:9px}
.stat-label svg{width:16px;height:16px;color:var(--accent)}
.stat strong{display:block;font-size:26px;margin:12px 0 6px;letter-spacing:-.5px;font-weight:700}
.stat small{font-size:10px;color:#8a9c8b}
.stat small.up{color:#5e9673}

.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.game-card{background:var(--panel);border-radius:18px;overflow:hidden;cursor:pointer;transition:.3s;animation:enter .5s both;position:relative}
.game-card:hover{transform:translateY(-6px);box-shadow:0 18px 40px #29212f18}
.game-cover{aspect-ratio:3/4;position:relative;overflow:hidden;background-size:cover;background-position:center}
.game-cover .cover-art{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;transition:.4s}
.game-card:hover .cover-art{transform:scale(1.05)}
.game-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,#00000095 0%,transparent 60%);pointer-events:none}
.game-rating{position:absolute;top:12px;right:12px;z-index:2;background:#00000060;backdrop-filter:blur(10px);color:#fff;padding:4px 9px;border-radius:10px;font-size:10px;display:flex;align-items:center;gap:4px;border:1px solid #ffffff20}
.game-rating svg{width:11px;height:11px;stroke:#ffd66b;fill:#ffd66b;stroke-width:2}
.game-platforms{position:absolute;top:12px;left:12px;z-index:2;display:flex;gap:4px}
.game-platforms span{background:#00000060;backdrop-filter:blur(10px);color:#fff;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:9px;font-weight:700;border:1px solid #ffffff20}
.game-info{padding:14px 16px 16px}
.game-title{font-size:13px;font-weight:600;margin-bottom:5px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-meta{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted)}
.game-meta .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--muted)}
.game-genre{display:inline-block;margin-top:8px;font-size:9px;background:var(--soft);color:var(--accent);padding:3px 8px;border-radius:8px;font-weight:500}

.cover-1{background:linear-gradient(135deg,#1a0f2e 0%,#4a2c6d 50%,#8b5cf6 100%)}
.cover-2{background:linear-gradient(135deg,#0c1929 0%,#1e3a5f 50%,#3b82f6 100%)}
.cover-3{background:linear-gradient(135deg,#1f0a0a 0%,#7f1d1d 50%,#dc2626 100%)}
.cover-4{background:linear-gradient(135deg,#2d1810 0%,#7c2d12 50%,#ea580c 100%)}
.cover-5{background:linear-gradient(135deg,#0a1f1a 0%,#065f46 50%,#10b981 100%)}
.cover-6{background:linear-gradient(135deg,#1a0f2e 0%,#581c87 50%,#c026d3 100%)}
.cover-7{background:linear-gradient(135deg,#1c1917 0%,#44403c 50%,#78716c 100%)}
.cover-8{background:linear-gradient(135deg,#172554 0%,#1e40af 50%,#3b82f6 100%)}
.cover-9{background:linear-gradient(135deg,#3b0764 0%,#6b21a8 50%,#a855f7 100%)}
.cover-10{background:linear-gradient(135deg,#052e16 0%,#166534 50%,#22c55e 100%)}
.cover-11{background:linear-gradient(135deg,#451a03 0%,#92400e 50%,#f59e0b 100%)}
.cover-12{background:linear-gradient(135deg,#082f49 0%,#0c4a6e 50%,#0ea5e9 100%)}

.cover-art .cover-title{position:relative;z-index:2;font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.5px;text-shadow:0 2px 12px #00000060;margin-bottom:6px}
.cover-art .cover-sub{position:relative;z-index:2;font-size:10px;opacity:.85;letter-spacing:1px;text-transform:uppercase}
.cover-art .cover-deco{position:absolute;top:18px;right:18px;font-size:60px;font-weight:900;opacity:.08;letter-spacing:-4px;line-height:1;z-index:1}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.cat-card{background:var(--panel);padding:20px 16px;border-radius:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.25s;border:1px solid transparent}
.cat-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 10px 25px #6d4fc415}
.cat-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.cat-icon svg{width:20px;height:20px;stroke:#fff;stroke-width:1.7}
.cat-card h3{font-size:13px;font-weight:600}
.cat-card p{font-size:10px;color:var(--muted);line-height:1.6}

.platform-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.platform-card{background:var(--panel);padding:22px;border-radius:18px;display:flex;align-items:center;gap:14px;transition:.25s;cursor:pointer}
.platform-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #29212f15}
.platform-logo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff;flex-shrink:0}
.platform-card h3{font-size:13px;font-weight:600;margin-bottom:3px}
.platform-card p{font-size:10px;color:var(--muted)}

.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.field{background:var(--soft);border:1px solid var(--line);padding:11px 14px;border-radius:11px;color:var(--text);outline:none;transition:.2s;width:100%}
.field:focus{border-color:var(--accent);background:var(--panel)}
.search-field{max-width:320px;flex:1;min-width:200px}
select.field{width:auto;cursor:pointer}
textarea.field{resize:vertical;min-height:80px;font-family:inherit}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--soft);padding:7px 13px;border-radius:20px;font-size:10px;cursor:pointer;transition:.2s;border:1px solid transparent}
.chip:hover{background:var(--line)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.game-detail{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;display:none;animation:slideIn .35s ease}
.game-detail.open{display:block}
@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.detail-hero{height:320px;position:relative;overflow:hidden;background-size:cover;background-position:center}
.detail-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,transparent 60%)}
.detail-back{position:absolute;top:20px;right:20px;z-index:5;background:#00000060;backdrop-filter:blur(12px);color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff20;transition:.2s}
.detail-back:hover{background:#00000090;transform:scale(1.05)}
.detail-back svg{width:20px;height:20px}
.detail-share{position:absolute;top:20px;left:20px;z-index:5;background:#00000060;backdrop-filter:blur(12px);color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff20}
.detail-share:hover{background:#00000090}

.detail-container{max-width:1000px;margin:-120px auto 0;padding:0 30px 60px;position:relative;z-index:3}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.detail-head h1{font-size:36px;font-weight:700;letter-spacing:-1px;line-height:1.3;margin-bottom:8px}
.detail-en{font-size:12px;color:var(--muted);letter-spacing:.5px;margin-bottom:12px}
.detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.detail-tags span{background:var(--panel);padding:5px 12px;border-radius:12px;font-size:10px;color:var(--text);border:1px solid var(--line)}
.rating-big{display:flex;align-items:center;gap:8px;background:var(--panel);padding:10px 18px;border-radius:16px;font-size:18px;font-weight:700;flex-shrink:0;box-shadow:0 4px 20px #00000010}
.rating-big svg{width:20px;height:20px;stroke:#f5b301;fill:#f5b301;stroke-width:2}

.detail-desc{font-size:13px;line-height:2.2;color:#55505c;margin-bottom:24px;background:var(--panel);padding:22px;border-radius:18px}

.detail-info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:22px;background:var(--panel);border-radius:18px;margin-bottom:24px}
.detail-info-grid>div{text-align:center;padding:12px;background:var(--soft);border-radius:12px}
.detail-info-grid b{display:block;font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:500}
.detail-info-grid span{font-size:12px;font-weight:600}

.detail-section{margin-top:28px}
.detail-section h2{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.detail-section h2 svg{width:18px;height:18px;color:var(--accent)}

.screenshots-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.screenshot{aspect-ratio:16/10;border-radius:14px;overflow:hidden;position:relative;cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;text-shadow:0 2px 8px #00000060;background-size:cover;background-position:center}
.screenshot::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#00000030,transparent);transition:.3s}
.screenshot:hover{transform:scale(1.03);box-shadow:0 12px 30px #00000030}
.screenshot:hover::after{background:transparent}
.screenshot span{position:relative;z-index:2;display:flex;align-items:center;gap:6px}
.screenshot span svg{width:16px;height:16px}

.detail-actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.detail-actions .primary{padding:12px 22px;font-size:12px}
.detail-actions .primary.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.detail-actions .primary.ghost:hover{background:var(--soft)}

.image-viewer{position:fixed;inset:0;z-index:300;background:#000000f0;display:none;align-items:center;justify-content:center;padding:40px;animation:fadeIn .25s}
.image-viewer.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.image-viewer-content{max-width:90vw;max-height:90vh;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700;aspect-ratio:16/10;min-width:60vw;background-size:cover;background-position:center}
.image-viewer-close{position:absolute;top:20px;left:20px;width:44px;height:44px;border-radius:50%;background:#ffffff20;color:#fff;display:grid;place-items:center;backdrop-filter:blur(10px)}
.image-viewer-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:#ffffff20;color:#fff;display:grid;place-items:center;backdrop-filter:blur(10px)}
.image-viewer-nav:hover{background:#ffffff40}
.image-viewer-nav.prev{right:20px}
.image-viewer-nav.next{left:20px}
.image-viewer-nav svg{width:22px;height:22px}

.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.about-feature{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.about-feature:last-child{border-bottom:0}
.about-feature .feat-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;flex-shrink:0}
.about-feature h3{font-size:13px;font-weight:600;margin-bottom:4px}
.about-feature p{font-size:11px;color:var(--muted);line-height:1.8}

.loading{text-align:center;padding:30px;color:var(--muted);font-size:12px}
.loading-dots{display:inline-flex;gap:4px}
.loading-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce 1.4s infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

.site-footer{grid-column:1/-1;margin-top:30px;padding:24px 10px;text-align:center;border-top:1px solid var(--line);background:linear-gradient(to bottom,transparent,var(--soft))}
.footer-slogan{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;letter-spacing:-.3px}
.footer-slogan span{background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.footer-made{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.footer-made .heart{color:#e74c6f;display:inline-block;animation:heartbeat 1.5s infinite;font-size:14px}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.footer-made b{font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.footer-links{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:10px;color:var(--muted)}
.footer-links a:hover{color:var(--accent)}

@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ============ ADMIN PANEL ============ */
.admin-overlay{position:fixed;inset:0;z-index:400;background:var(--bg);overflow-y:auto;display:none;animation:fadeIn .3s}
.admin-overlay.open{display:block}
.admin-wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.admin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.admin-head h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.admin-head h1 .admin-badge{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:10px;padding:3px 10px;border-radius:10px;font-weight:600}
.admin-head-actions{display:flex;gap:8px}
.admin-tabs{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:16px;margin-bottom:22px;overflow-x:auto}
.admin-tab{padding:9px 18px;border-radius:12px;font-size:12px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap;color:var(--muted)}
.admin-tab.active{background:var(--accent);color:#fff;box-shadow:0 4px 10px #6d4fc440}
.admin-tab:hover:not(.active){background:var(--soft);color:var(--text)}

.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.admin-stat{background:var(--panel);padding:18px;border-radius:16px}
.admin-stat b{display:block;font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:500}
.admin-stat strong{font-size:22px;font-weight:700}

.admin-toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.admin-toolbar .search-field{max-width:300px}
.admin-btn{background:var(--accent);color:#fff;padding:9px 16px;border-radius:12px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.admin-btn:hover{background:var(--accent-2);transform:translateY(-1px)}
.admin-btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.admin-btn.ghost:hover{background:var(--soft)}
.admin-btn.danger{background:var(--danger);color:#fff}
.admin-btn.danger:hover{background:#b91c1c}
.admin-btn svg{width:14px;height:14px}

.admin-list{display:grid;gap:12px}
.admin-item{background:var(--panel);padding:14px;border-radius:14px;display:flex;align-items:center;gap:14px;transition:.2s}
.admin-item:hover{box-shadow:0 6px 18px #00000010}
.admin-item-cover{width:60px;height:80px;border-radius:10px;background-size:cover;background-position:center;flex-shrink:0;background-color:var(--soft)}
.admin-item-cover.banner{width:100px;height:60px}
.admin-item-info{flex:1;min-width:0}
.admin-item-info h3{font-size:13px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-item-info p{font-size:10px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.admin-item-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.admin-item-meta span{background:var(--soft);padding:2px 8px;border-radius:8px;font-size:9px;color:var(--muted)}
.admin-item-actions{display:flex;gap:6px;flex-shrink:0}
.admin-icon-btn{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--text);transition:.2s}
.admin-icon-btn:hover{background:var(--line)}
.admin-icon-btn.danger{color:var(--danger)}
.admin-icon-btn.danger:hover{background:#fee2e2}
.admin-icon-btn svg{width:15px;height:15px}

.admin-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:12px;background:var(--panel);border-radius:16px;border:2px dashed var(--line)}
.admin-empty svg{width:40px;height:40px;margin:0 auto 12px;opacity:.4}

/* Admin modal */
.admin-modal{position:fixed;inset:0;z-index:500;background:#00000070;backdrop-filter:blur(10px);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.admin-modal.open{display:flex}
.admin-modal-inner{background:var(--panel);border-radius:22px;padding:24px;max-width:600px;width:100%;margin:auto;animation:enter .3s}
.admin-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.admin-modal-head h2{font-size:16px;font-weight:600}
.admin-form{display:grid;gap:14px}
.admin-form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.admin-form label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:500}
.admin-form .field{width:100%}

.image-upload{border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;cursor:pointer;transition:.2s;background:var(--soft);position:relative}
.image-upload:hover{border-color:var(--accent);background:var(--panel)}
.image-upload.has-image{padding:0;border-style:solid}
.image-upload svg{width:28px;height:28px;color:var(--muted);margin-bottom:8px}
.image-upload p{font-size:11px;color:var(--muted)}
.image-upload small{font-size:9px;color:var(--muted);opacity:.7}
.image-upload img{width:100%;height:180px;object-fit:cover;border-radius:12px;display:block}
.image-upload .remove-img{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;background:#00000080;color:#fff;display:grid;place-items:center;z-index:2}
.image-upload .remove-img svg{width:14px;height:14px;color:#fff;margin:0}
.image-upload input[type=file]{display:none}

.admin-form-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#2a1f4a 0%,#6d4fc4 50%,#b464c8 100%)}
.login-card{background:var(--panel);border-radius:24px;padding:32px;max-width:400px;width:100%;box-shadow:0 20px 60px #00000040}
.login-head{text-align:center;margin-bottom:24px}
.login-logo{width:64px;height:64px;margin:0 auto 14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:18px;display:grid;place-items:center;color:#fff;font-size:28px;font-weight:800;box-shadow:0 8px 20px #6d4fc440}
.login-head h1{font-size:20px;font-weight:700;margin-bottom:6px}
.login-head p{font-size:11px;color:var(--muted)}
.login-form{display:grid;gap:14px}
.login-form label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:500}
.login-form .field{width:100%}
.login-error{background:#fee2e2;color:#b91c1c;padding:10px 14px;border-radius:10px;font-size:11px;display:none}
.login-error.show{display:block}
.login-back{display:block;text-align:center;margin-top:16px;font-size:11px;color:var(--muted);cursor:pointer}
.login-back:hover{color:var(--accent)}

body.dark{--bg:#232127;--panel:#2a282e;--soft:#322f36;--text:#eeebf2;--muted:#aaa3b3;--line:#3b373f;background:#1a181d}
.dark .shell{border-color:#39343f}
.dark nav a.active{background:#1a181d}
.dark .primary{background:var(--accent);color:#fff}
.dark .primary:hover{background:var(--accent-2)}
.dark .primary svg{stroke:#fff}
.dark .badge{background:#2d3548;color:#8fa8d8}
.dark .hero{background:linear-gradient(120deg,#1a0f2e 0%,#4a2c6d 50%,#7c3aed 100%)}
.dark .detail-desc{color:#b8b2c2}
.dark .game-detail{background:var(--bg)}
.dark .admin-btn.ghost{background:var(--panel);color:var(--text);border-color:var(--line)}
.dark .admin-icon-btn.danger:hover{background:#4a1c1c}

@media(min-width:1440px){.shell{margin:54px auto}.hero{height:320px}.hero h2{font-size:32px}}
@media(max-width:1199px){.shell{width:calc(100% - 40px);margin:24px auto;padding:20px 22px 18px;gap:0 20px;grid-template-columns:38px minmax(0,1fr)}header{gap:15px}.brand{min-width:93px;font-size:14px}.brand-icon{width:33px;height:33px}nav a{padding:8px 12px;font-size:10px}.profile{min-width:165px;height:42px}.panel{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.hero{height:240px}.hero h2{font-size:24px}.games-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.ad-banners{grid-template-columns:repeat(3,1fr)}.admin-stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){header{flex-wrap:wrap;gap:14px;margin-bottom:25px}.brand{margin-left:auto}.header-tools{margin-right:auto}nav{order:4;width:100%;justify-content:center;margin-top:6px}nav a{padding:8px 22px;font-size:11px}.profile{min-width:186px}.about-grid{grid-template-columns:1fr}.detail-info-grid{grid-template-columns:repeat(2,1fr)}.screenshots-grid{grid-template-columns:repeat(2,1fr)}.ad-banners{grid-template-columns:repeat(2,1fr)}.ad-banners .ad-banner:nth-child(3){display:none}.admin-form-row{grid-template-columns:1fr}}
@media(max-width:740px){.stats{grid-template-columns:1fr 1fr}.games-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.hero{padding:20px}.hero h2{font-size:20px}.hero p{font-size:11px}.detail-hero{height:240px}.detail-container{padding:0 20px 40px}.detail-head h1{font-size:26px}.screenshots-grid{grid-template-columns:1fr 1fr}.ad-banners{grid-template-columns:1fr}.admin-stats{grid-template-columns:1fr}.admin-item{flex-wrap:wrap}}
@media(max-width:560px){body{background:var(--bg)}.shell{display:block;width:100%;margin:0;border:0;border-radius:0;padding:16px 14px 90px;min-height:100vh}header{gap:10px;margin-bottom:20px;flex-wrap:nowrap}.brand{font-size:14px;min-width:auto}.brand-icon{height:32px;width:32px;font-size:16px}nav{display:none}.hamburger{display:grid}.profile{min-width:0;width:40px;height:40px;padding:4px}.profile>span:nth-child(2),.profile>span:last-child{display:none}.header-tools{padding:5px 6px;margin-right:0;gap:2px}.header-tools .icon-btn{width:27px;height:29px}.bottom-nav{display:block}aside{display:none}.page-heading{margin:0 0 20px;gap:12px;min-height:auto;flex-direction:column;align-items:flex-start}.page-heading .primary{margin-top:12px;padding:8px 14px;font-size:10px;min-height:34px}h1{font-size:24px;letter-spacing:-.8px;margin-bottom:5px}.page-heading p{font-size:10px;line-height:1.9;max-width:300px}.panel{padding:16px;border-radius:19px}.stats{grid-template-columns:1fr 1fr;gap:12px}.stat{padding:16px}.stat strong{font-size:20px}.games-grid{grid-template-columns:repeat(2,1fr);gap:10px}.game-info{padding:10px 12px 12px}.game-title{font-size:11px}.game-meta{font-size:9px}.cat-grid{grid-template-columns:repeat(2,1fr)}.platform-grid{grid-template-columns:1fr}.toolbar{gap:9px}.search-field{max-width:none;min-width:0}.detail-info-grid{grid-template-columns:1fr 1fr;gap:10px}.screenshots-grid{grid-template-columns:1fr}.detail-hero{height:200px}.detail-container{margin-top:-80px;padding:0 16px 40px}.detail-head h1{font-size:22px}.detail-head{flex-direction:column}.detail-desc{padding:16px;font-size:12px}.ad-banners{grid-template-columns:1fr}.ad-banner{height:110px}.ad-content h3{font-size:14px}.site-footer{padding:20px 10px;margin-top:20px}.footer-slogan{font-size:12px}.footer-made{font-size:10px}.admin-wrap{padding:16px 12px 60px}.admin-head h1{font-size:18px}.admin-modal-inner{padding:18px}.admin-form-row{grid-template-columns:1fr}.admin-item-cover{width:50px;height:66px}.admin-item-cover.banner{width:80px;height:50px}.admin-item-actions{width:100%;justify-content:flex-end}}

<body>
<div class="shell">
  <header>
    <a class="brand" href="#home"><span class="brand-icon">G</span> The Game</a>
    <button class="hamburger" id="hamburgerBtn" aria-label="منو"></button>
    <nav id="topnav" aria-label="منوی اصلی"></nav>
    <div class="header-tools">
      <button class="icon-btn" id="searchOpen" aria-label="جستجو" data-icon="search"></button>
      <button class="icon-btn dot" id="notifications" aria-label="اعلان‌ها" data-icon="bell"></button>
      <button class="icon-btn" id="help" aria-label="راهنما" data-icon="info"></button>
    </div>
    <button class="profile" id="profileOpen">
      <span class="avatar">ع</span>
      <span><b>بازی های عصر جدید</b><small>مرجع معرفی بازی</small></span>
      <span data-icon="chevron"></span>
    </button>
  </header>

  <aside>
    <div class="rail-group">
      <button class="icon-btn" id="theme" aria-label="تغییر تم" data-icon="sun"></button>
      <button class="icon-btn" id="quiet" aria-label="حالت تمرکز" data-icon="moon"></button>
    </div>
    <div class="rail-group" id="railnav"></div>
    <div class="rail-group rail-bottom">
      <button class="icon-btn" id="support" aria-label="پشتیبانی" data-icon="info"></button>
      <button class="icon-btn" id="settings" aria-label="تنظیمات" data-icon="settings"></button>
    </div>
  </aside>

  <main>
    <div class="page-heading">
      <div>
        <h1 id="title">نمای کلی</h1>
        <p id="subtitle"></p>
      </div>
      <button class="primary" id="mainAction"></button>
    </div>
    <div id="content"></div>
    <footer class="site-footer">
      <div class="footer-slogan">دنیای بازی‌ها در دستان شما · <span>The Game</span></div>
      <div class="footer-made">
        made with <span class="heart">♥</span> <b>nexa af</b>
      </div>
      <div class="footer-links">
        <a href="#home">خانه</a>
        <a href="#games">بازی‌ها</a>
        <a href="#about">درباره ما</a>
      </div>
    </footer>
  </main>
</div>

<nav class="bottom-nav" id="bottomNav"><div class="bottom-nav-inner"></div></nav>

<div class="mobile-menu" id="mobileMenu">
  <div class="mobile-menu-inner">
    <div class="mobile-menu-head">
      <b>منو</b>
      <button class="mobile-menu-close" id="mobileMenuClose" aria-label="بستن"></button>
    </div>
    <div id="mobileMenuLinks"></div>
  </div>
</div>

<div class="game-detail" id="gameDetail" role="dialog" aria-modal="true"></div>

<div class="image-viewer" id="imageViewer">
  <button class="image-viewer-close" id="imageViewerClose" aria-label="بستن"></button>
  <button class="image-viewer-nav prev" id="imgPrev" aria-label="قبلی"></button>
  <button class="image-viewer-nav next" id="imgNext" aria-label="بعدی"></button>
  <div class="image-viewer-content" id="imageViewerContent"></div>
</div>

<!-- Admin Login -->
<div class="admin-overlay" id="adminLogin">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-head">
        <div class="login-logo">G</div>
        <h1>ورود به پنل مدیریت</h1>
        <p>برای مدیریت سایت، اطلاعات خود را وارد کنید</p>
      </div>
      <form class="login-form" id="loginForm">
        <div>
          <label>شناسه کاربری</label>
          <input class="field" id="loginUser" placeholder="admin" dir="ltr" autocomplete="username" required>
        </div>
        <div>
          <label>رمز عبور</label>
          <input class="field" id="loginPass" type="password" placeholder="••••••••" dir="ltr" autocomplete="current-password" required>
        </div>
        <div class="login-error" id="loginError">شناسه یا رمز عبور اشتباه است</div>
        <button type="submit" class="primary" style="width:100%;justify-content:center;padding:12px">ورود به پنل</button>
      </form>
      <span class="login-back" id="loginBack">بازگشت به سایت</span>
    </div>
  </div>
</div>

<!-- Admin Panel -->
<div class="admin-overlay" id="adminPanel">
  <div class="admin-wrap">
    <div class="admin-head">
      <h1>پنل مدیریت <span class="admin-badge">ADMIN</span></h1>
      <div class="admin-head-actions">
        <button class="admin-btn ghost" id="adminBackSite">${''}بازگشت به سایت</button>
        <button class="admin-btn danger" id="adminLogout">${''}خروج</button>
      </div>
    </div>
    <div class="admin-tabs">
      <div class="admin-tab active" data-tab="games">بازی‌ها</div>
      <div class="admin-tab" data-tab="banners">بنرها</div>
      <div class="admin-tab" data-tab="stats">آمار</div>
    </div>
    <div id="adminContent"></div>
  </div>
</div>

<!-- Admin Modal -->
<div class="admin-modal" id="adminModal">
  <div class="admin-modal-inner" id="adminModalInner"></div>
</div>

<div id="toast" role="status"></div>

  return [...state.customGames,...base,...extraGames];
}

function coverStyle(g){
  if(g.image)return `background-image:url('${g.image}')`;
  return '';
}

function gameCard(g,i){
  const inlineStyle=coverStyle(g);
  return `<article class="game-card" data-game="${g.id}" style="animation-delay:${(i%PAGE_SIZE)*40}ms">
    <div class="game-cover" ${inlineStyle?`style="${inlineStyle}"`:''}>
      ${!g.image?`<div class="cover-art cover-${g.cover}">
        <span class="cover-deco">${g.en.charAt(0)}</span>
        <div class="cover-title">${g.title}</div>
        <div class="cover-sub">${g.en}</div>
      </div>`:''}
      <div class="game-rating">${icon('star')}<span>${fa(g.rating)}</span></div>
      <div class="game-platforms">${g.platforms.map(p=>`<span>${p}</span>`).join('')}</div>
    </div>
    <div class="game-info">
      <div class="game-title">${g.title}</div>
      <div class="game-meta">
        <span>${fa(g.year)}</span>
        <span class="dot-sep"></span>
        <span>${g.developer}</span>
      </div>
      <span class="game-genre">${g.genre}</span>
    </div>
  </article>`;
}

function openGameDetail(id){

  if(!g)return;
  currentDetailGame=g;
  const screenshots=[];
  if(g.image)screenshots.push({image:g.image,title:'تصویر اصلی'});
  if(g.screenshots)g.screenshots.forEach((s,i)=>screenshots.push({image:s,title:`اسکرین‌شات ${fa(i+1)}`}));
  if(screenshots.length===0){
    [1,2,3].forEach(n=>screenshots.push({cover:(g.cover+n-1)%12+1,title:`اسکرین‌شات ${fa(n)}`}));
  }
  
  const heroStyle=g.image?`style="background-image:url('${g.image}')"`:`class="cover-${g.cover}"`;
  
  $('#gameDetail').innerHTML=`
    <div class="detail-hero" ${heroStyle}>
      <button class="detail-back" id="detailBack" aria-label="بازگشت">${icon('arrow')}</button>

        <div>

          <div class="detail-en">${g.en}</div>
          <div class="detail-tags">
            ${g.tags.map(t=>`<span>${t}</span>`).join('')}
          </div>
        </div>
        <div class="rating-big">${icon('star')}<span>${fa(g.rating)}</span></div>

        <div><b>سازنده</b><span>${g.developer}</span></div>

function renderImageViewer(){
  const {images,index}=currentImageViewer;
  const img=images[index];
  const el=$('#imageViewerContent');
  if(img.image){
    el.className='image-viewer-content';
    el.style.backgroundImage=`url('${img.image}')`;
    el.innerHTML='';
  }else{
    el.className='image-viewer-content cover-'+img.cover;

    el.innerHTML=`<span style="position:relative;z-index:2;display:flex;align-items:center;gap:10px;font-size:20px">${icon('image')}${img.title}</span>`;

  $('#imgPrev').style.transform='rotate(180deg)';
  $('#imgNext').style.transform='';
}

$('#imgPrev').onclick=()=>{
  const {images}=currentImageViewer;
  currentImageViewer.index=(currentImageViewer.index-1+images.length)%images.length;
  renderImageViewer();
};
$('#imgNext').onclick=()=>{
  const {images}=currentImageViewer;
  currentImageViewer.index=(currentImageViewer.index+1)%images.length;
  renderImageViewer();
};
$('#imageViewerClose').onclick=closeImageViewer;

  if(activeFilter!=='all')filtered=filtered.filter(g=>g.cat===activeFilter);
  return filtered;
}

function loadMoreGames(){
  const filtered=getFilteredGames();
  const nextBatch=filtered.slice(displayedCount,displayedCount+PAGE_SIZE);
  if(nextBatch.length===0)return false;
  const grid=$('#gamesGrid');
  if(!grid)return false;
  nextBatch.forEach((g,i)=>{
    const temp=document.createElement('div');
    temp.innerHTML=gameCard(g,displayedCount+i);
    const card=temp.firstElementChild;
    grid.appendChild(card);
    card.onclick=()=>openGameDetail(g.id);
  });
  displayedCount+=nextBatch.length;
  $('#gameCount').textContent=fa(filtered.length)+' بازی';
  return nextBatch.length===PAGE_SIZE;
}

let scrollObserver=null;
function render(){
  currentPage=location.hash.slice(1)||'home';
  if(currentPage.startsWith('game-'))currentPage='home';
  if(!meta[currentPage])currentPage='home';
  
  $('#topnav').innerHTML=pages.map(([id,t])=>`<a href="#${id}" class="${id===currentPage?'active':''}" ${id===currentPage?'aria-current="page"':''}>${t}</a>`).join('');
  $('#railnav').innerHTML=pages.map(([id,t,i])=>`<a href="#${id}" title="${t}" aria-label="${t}" class="${id===currentPage?'active':''}">${icon(i)}</a>`).join('');
  $('.bottom-nav-inner').innerHTML=pages.slice(0,5).map(([id,t,i])=>`<a href="#${id}" class="${id===currentPage?'active':''}">${icon(i)}<span>${t}</span></a>`).join('');
  $('#mobileMenuLinks').innerHTML=pages.map(([id,t,i])=>`<a href="#${id}" class="${id===currentPage?'active':''}">${icon(i)}<span>${t}</span></a>`).join('');
  $('#mobileMenuClose').innerHTML=icon('close');
  
  const [t,s,_,i]=meta[currentPage];
  $('#title').textContent=t;
  $('#subtitle').textContent=s;
  $('#mainAction').innerHTML=icon(i)+i;
  
  const content={home:renderHome,games:renderGames,categories:renderCategories,new:renderNew,platforms:renderPlatforms,about:renderAbout}[currentPage]();
  $('#content').innerHTML=content;
  
  document.body.classList.toggle('dark',state.dark);
  icons();
  bindPage();
  
  if(currentPage==='games'){
    setTimeout(()=>loadMoreGames(),50);
  }
  if(currentPage==='new'){
    const sorted=getAllGames().slice().sort((a,b)=>b.year-a.year);
    if(scrollObserver)scrollObserver.disconnect();
    const sentinel=$('#scrollSentinel');
    if(sentinel){
      let newDisplayed=0;
      const loadNew=()=>{
        const next=sorted.slice(newDisplayed,newDisplayed+PAGE_SIZE);
        if(next.length===0)return false;
        const grid=$('#gamesGrid');
        if(!grid)return false;
        next.forEach((g,i)=>{
          const temp=document.createElement('div');
          temp.innerHTML=gameCard(g,newDisplayed+i);
          const card=temp.firstElementChild;
          grid.appendChild(card);
          card.onclick=()=>openGameDetail(g.id);
        });
        newDisplayed+=next.length;
        return next.length===PAGE_SIZE;
      };
      setTimeout(()=>loadNew(),50);
      scrollObserver=new IntersectionObserver(entries=>{
        if(entries[0].isIntersecting){
          $('#loadingMore').style.display='block';
          setTimeout(()=>{
            const hasMore=loadNew();
            $('#loadingMore').style.display=hasMore?'block':'none';
            if(!hasMore)scrollObserver.disconnect();
          },400);
        }
      },{rootMargin:'200px'});
      scrollObserver.observe(sentinel);
    }
  }
}

function bindPage(){
  $$('.game-card').forEach(c=>{c.onclick=()=>openGameDetail(c.dataset.game)});
  $$('.hero-btn[data-game]').forEach(b=>{b.onclick=()=>openGameDetail(b.dataset.game)});
  $$('[data-goto]').forEach(b=>{b.onclick=()=>location.hash=b.dataset.goto});
  $$('.ad-banner').forEach(b=>{
    b.onclick=()=>{
      if(b.dataset.game){
        const g=getAllGames().find(x=>x.id==b.dataset.game);
        if(g)openGameDetail(g.id);
      }
    };
  });
  
  if(currentPage==='games'){
    const searchEl=$('#gameSearch');
    if(searchEl){
      searchEl.oninput=e=>{
        searchQuery=e.target.value;
        displayedCount=0;
        $('#gamesGrid').innerHTML='';
        loadMoreGames();
      };
    }
    $$('.chip').forEach(c=>{
      c.onclick=()=>{
        activeFilter=c.dataset.filter;
        $$('.chip').forEach(x=>x.classList.remove('active'));
        c.classList.add('active');
        displayedCount=0;
        $('#gamesGrid').innerHTML='';
        loadMoreGames();
      };
    });
    const sortEl=$('#sortBy');
    if(sortEl){
      sortEl.onchange=e=>{
        const v=e.target.value;
        const all=getAllGames();
        if(v==='rating')all.sort((a,b)=>b.rating-a.rating);
        else if(v==='year')all.sort((a,b)=>b.year-a.year);
        else if(v==='name')all.sort((a,b)=>a.title.localeCompare(b.title,'fa'));
        displayedCount=0;
        $('#gamesGrid').innerHTML='';
        loadMoreGames();
      };
    }
    if(scrollObserver)scrollObserver.disconnect();
    const sentinel=$('#scrollSentinel');
    if(sentinel){
      scrollObserver=new IntersectionObserver(entries=>{
        if(entries[0].isIntersecting){
          $('#loadingMore').style.display='block';
          setTimeout(()=>{
            const hasMore=loadMoreGames();
            $('#loadingMore').style.display=hasMore?'block':'none';
            if(!hasMore)scrollObserver.disconnect();
          },400);
        }
      },{rootMargin:'200px'});
      scrollObserver.observe(sentinel);
    }
  }
  
  if(currentPage==='categories'){
    $$('.cat-card').forEach(c=>{
      c.onclick=()=>{activeFilter=c.dataset.cat;location.hash='games'};
    });
  }
}

function renderAdminGames(){
  const all=getAllGames();
  const filtered=adminSearch?all.filter(g=>(g.title+g.en).toLowerCase().includes(adminSearch.toLowerCase())):all;

    if(g)openGameForm(g);
  });
  $$('[data-del]').forEach(b=>b.onclick=()=>{

    const g=getAllGames().find(x=>x.id===id);
    if(!g)return;
    if(!confirm(`آیا از حذف "${g.title}" مطمئن هستید؟`))return;
    deleteGame(id);
  });

function deleteGame(id){
  // Check if custom
  const ci=state.customGames.findIndex(g=>g.id===id);
  if(ci>=0){
    state.customGames.splice(ci,1);
  }else{
    // It's a base game
    if(!state.deletedBaseIds.includes(id))state.deletedBaseIds.push(id);
  }
  persist();
  renderAdminGames();
  toast('بازی با موفقیت حذف شد');
}

function openGameForm(game){
  const isEdit=!!game;
  const g=game||{
    title:'',en:'',cover:1,rating:8.0,genre:'',cat:'action',
    year:new Date().getFullYear(),platforms:['PC'],
    developer:'',publisher:'',players:'تک‌نفره',size:'',
    desc:'',tags:[],image:null,screenshots:[]
  };
  
  const modal=$('#adminModalInner');
  modal.innerHTML=`
    <div class="admin-modal-head">
      <h2>${isEdit?'ویرایش بازی':'افزودن بازی جدید'}</h2>
      <button class="admin-icon-btn" id="closeGameForm">${icon('close')}</button>
    </div>
    <form class="admin-form" id="gameForm">
      <div>
        <label>تصویر کاور بازی</label>
        <div class="image-upload ${g.image?'has-image':''}" id="coverUpload">
          ${g.image?`<img src="${g.image}" alt="cover"><button type="button" class="remove-img" data-remove="cover">${icon('close')}</button>`:`${icon('upload')}<p>برای انتخاب تصویر کلیک کنید</p><small>فرمت‌های JPG، PNG، WebP</small>`}
          <input type="file" accept="image/*" id="coverInput">
        </div>
      </div>
      <div class="admin-form-row">
        <div><label>عنوان فارسی *</label><input class="field" name="title" value="${escapeHtml(g.title)}" required></div>
        <div><label>عنوان انگلیسی *</label><input class="field" name="en" dir="ltr" value="${escapeHtml(g.en)}" required></div>
      </div>
      <div>
        <label>توضیحات بازی *</label>
        <textarea class="field" name="desc" rows="4" required>${escapeHtml(g.desc)}</textarea>
      </div>
      <div class="admin-form-row">
        <div><label>ژانر *</label><input class="field" name="genre" value="${escapeHtml(g.genre)}" placeholder="مثلاً: اکشن ماجراجویی" required></div>
        <div>
          <label>دسته‌بندی *</label>
          <select class="field" name="cat" required>
            ${categories.map(c=>`<option value="${c.id}" ${g.cat===c.id?'selected':''}>${c.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="admin-form-row">
        <div><label>سال انتشار</label><input class="field" type="number" name="year" value="${g.year}" min="1970" max="2030"></div>
        <div><label>امتیاز (از ۱۰)</label><input class="field" type="number" step="0.1" min="0" max="10" name="rating" dir="ltr" value="${g.rating}"></div>
      </div>
      <div class="admin-form-row">
        <div><label>سازنده</label><input class="field" name="developer" value="${escapeHtml(g.developer)}"></div>
        <div><label>ناشر</label><input class="field" name="publisher" value="${escapeHtml(g.publisher)}"></div>
      </div>
      <div class="admin-form-row">
        <div><label>حالت بازی</label><input class="field" name="players" value="${escapeHtml(g.players)}" placeholder="تک‌نفره / چندنفره"></div>
        <div><label>حجم</label><input class="field" name="size" value="${escapeHtml(g.size)}" placeholder="مثلاً: 50 گیگابایت"></div>
      </div>
      <div>
        <label>پلتفرم‌ها (با کاما جدا کنید)</label>
        <input class="field" name="platforms" dir="ltr" value="${g.platforms.join(', ')}" placeholder="PC, PS5, XBOX">
      </div>
      <div>
        <label>برچسب‌ها (با کاما جدا کنید)</label>
        <input class="field" name="tags" value="${g.tags.join(', ')}" placeholder="جهان‌باز, داستانی, فانتزی">
      </div>
      <div>
        <label>تصاویر گالری (چند انتخابی)</label>
        <div class="image-upload ${g.screenshots&&g.screenshots.length?'has-image':''}" id="galleryUpload" style="min-height:100px">
          ${g.screenshots&&g.screenshots.length?`
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px">
              ${g.screenshots.map((s,i)=>`<div style="position:relative"><img src="${s}" style="width:100%;height:80px;object-fit:cover;border-radius:8px"><button type="button" class="remove-img" data-remove-gallery="${i}" style="top:4px;left:4px;width:22px;height:22px">${icon('close')}</button></div>`).join('')}
            </div>
            <p style="margin-top:8px">کلیک برای افزودن تصاویر بیشتر</p>
          `:`${icon('upload')}<p>برای انتخاب تصاویر گالری کلیک کنید</p><small>می‌توانید چند تصویر انتخاب کنید</small>`}
          <input type="file" accept="image/*" multiple id="galleryInput">
        </div>
      </div>
      <div class="admin-form-actions">
        <button type="button" class="admin-btn ghost" id="cancelGameForm">انصراف</button>
        <button type="submit" class="admin-btn">${icon('plus')}${isEdit?'ذخیره تغییرات':'افزودن بازی'}</button>
      </div>
    </form>
  `;
  
  $('#adminModal').classList.add('open');
  
  // State for form
  let formImage=g.image;
  let formScreenshots=[...(g.screenshots||[])];
  
  const bindCoverUpload=()=>{
    const up=$('#coverUpload');
    const input=$('#coverInput');
    up.onclick=e=>{
      if(e.target.closest('.remove-img'))return;
      input.click();
    };
    input.onchange=e=>{
      const f=e.target.files[0];
      if(!f)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        formImage=ev.target.result;
        up.classList.add('has-image');
        up.innerHTML=`<img src="${formImage}" alt="cover"><button type="button" class="remove-img" data-remove="cover">${icon('close')}</button><input type="file" accept="image/*" id="coverInput">`;
        bindCoverUpload();
      };
      reader.readAsDataURL(f);
    };
    up.querySelectorAll('[data-remove="cover"]').forEach(b=>{
      b.onclick=e=>{
        e.stopPropagation();
        formImage=null;
        up.classList.remove('has-image');
        up.innerHTML=`${icon('upload')}<p>برای انتخاب تصویر کلیک کنید</p><small>فرمت‌های JPG، PNG، WebP</small><input type="file" accept="image/*" id="coverInput">`;
        bindCoverUpload();
      };
    });
  };
  bindCoverUpload();
  
  const bindGalleryUpload=()=>{
    const up=$('#galleryUpload');
    const input=$('#galleryInput');
    up.onclick=e=>{
      if(e.target.closest('.remove-img'))return;
      input.click();
    };
    input.onchange=e=>{
      const files=[...e.target.files];
      if(!files.length)return;
      let loaded=0;
      files.forEach(f=>{
        const reader=new FileReader();
        reader.onload=ev=>{
          formScreenshots.push(ev.target.result);
          loaded++;
          if(loaded===files.length)refreshGallery();
        };
        reader.readAsDataURL(f);
      });
    };
    up.querySelectorAll('[data-remove-gallery]').forEach(b=>{
      b.onclick=e=>{
        e.stopPropagation();
        const idx=parseInt(b.dataset.removeGallery);
        formScreenshots.splice(idx,1);
        refreshGallery();
      };
    });
  };
  
  const refreshGallery=()=>{
    const up=$('#galleryUpload');
    if(formScreenshots.length){
      up.classList.add('has-image');
      up.innerHTML=`
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px">
          ${formScreenshots.map((s,i)=>`<div style="position:relative"><img src="${s}" style="width:100%;height:80px;object-fit:cover;border-radius:8px"><button type="button" class="remove-img" data-remove-gallery="${i}" style="top:4px;left:4px;width:22px;height:22px">${icon('close')}</button></div>`).join('')}
        </div>
        <p style="margin-top:8px">کلیک برای افزودن تصاویر بیشتر</p>
        <input type="file" accept="image/*" multiple id="galleryInput">
      `;
    }else{
      up.classList.remove('has-image');
      up.innerHTML=`${icon('upload')}<p>برای انتخاب تصاویر گالری کلیک کنید</p><small>می‌توانید چند تصویر انتخاب کنید</small><input type="file" accept="image/*" multiple id="galleryInput">`;
    }
    bindGalleryUpload();
  };
  bindGalleryUpload();
  
  $('#closeGameForm').onclick=$('#cancelGameForm').onclick=()=>$('#adminModal').classList.remove('open');
  
  $('#gameForm').onsubmit=e=>{
    e.preventDefault();
    const d=new FormData(e.target);
    const newGame={
      id:isEdit?g.id:(Date.now()+Math.floor(Math.random()*1000)),
      title:String(d.get('title')).trim(),
      en:String(d.get('en')).trim(),
      desc:String(d.get('desc')).trim(),
      genre:String(d.get('genre')).trim(),
      cat:String(d.get('cat')),
      year:Number(d.get('year'))||new Date().getFullYear(),
      rating:parseFloat(d.get('rating'))||8.0,
      developer:String(d.get('developer')).trim()||'Unknown',
      publisher:String(d.get('publisher')).trim()||'Unknown',
      players:String(d.get('players')).trim()||'تک‌نفره',
      size:String(d.get('size')).trim()||'نامشخص',
      platforms:String(d.get('platforms')).split(',').map(s=>s.trim()).filter(Boolean),
      tags:String(d.get('tags')).split(',').map(s=>s.trim()).filter(Boolean),
      image:formImage,
      screenshots:formScreenshots,
      cover:g.cover||((Math.floor(Math.random()*12))+1)
    };
    
    if(isEdit){
      // Check if custom or base
      const ci=state.customGames.findIndex(x=>x.id===g.id);
      if(ci>=0){
        state.customGames[ci]=newGame;
      }else{
        // Replace base game with custom version
        if(!state.deletedBaseIds.includes(g.id))state.deletedBaseIds.push(g.id);
        state.customGames.push(newGame);
      }
      toast('بازی با موفقیت ویرایش شد');
    }else{
      state.customGames.push(newGame);
      toast('بازی جدید با موفقیت اضافه شد');
    }
    persist();
    $('#adminModal').classList.remove('open');
    renderAdminGames();
  };
}

          <div class="admin-item-actions">
            <button class="admin-icon-btn" data-bedit="${b.id}" title="ویرایش">${icon('edit')}</button>
            <button class="admin-icon-btn danger" data-bdel="${b.id}" title="حذف">${icon('trash')}</button>
          </div>
        </div>
      `).join(''):'<div class="admin-empty">'+icon('image')+'<p>بنری وجود ندارد</p></div>'}
    </div>
  `;
  
  $('#addBannerBtn').onclick=()=>openBannerForm(null);
  $$('[data-bedit]').forEach(b=>b.onclick=()=>{
    const banner=state.banners.find(x=>x.id===b.dataset.bedit);
    if(banner)openBannerForm(banner);
  });
  $$('[data-bdel]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.bdel;
    const banner=state.banners.find(x=>x.id===id);
    if(!banner)return;
    if(!confirm(`آیا از حذف بنر "${banner.title}" مطمئن هستید؟`))return;
    state.banners=state.banners.filter(x=>x.id!==id);
    persist();
    renderAdminBanners();
    toast('بنر با موفقیت حذف شد');
  });
}

function openBannerForm(banner){
  const isEdit=!!banner;
  const b=banner||{title:'',desc:'',gameId:'',image:null,gradient:'ad-1',deco:''};
  
  const allGames=getAllGames();
  
  $('#adminModalInner').innerHTML=`
    <div class="admin-modal-head">
      <h2>${isEdit?'ویرایش بنر':'افزودن بنر جدید'}</h2>
      <button class="admin-icon-btn" id="closeBannerForm">${icon('close')}</button>
    </div>
    <form class="admin-form" id="bannerForm">
      <div>
        <label>تصویر بنر</label>
        <div class="image-upload ${b.image?'has-image':''}" id="bannerUpload">
          ${b.image?`<img src="${b.image}" alt="banner"><button type="button" class="remove-img" data-remove="banner">${icon('close')}</button>`:`${icon('upload')}<p>برای انتخاب تصویر بنر کلیک کنید</p><small>پیشنهاد: ابعاد 800×300 پیکسل</small>`}
          <input type="file" accept="image/*" id="bannerInput">
        </div>
      </div>
      <div>
        <label>عنوان بنر *</label>
        <input class="field" name="title" value="${escapeHtml(b.title)}" required>
      </div>
      <div>
        <label>توضیحات</label>
        <textarea class="field" name="desc" rows="2">${escapeHtml(b.desc||'')}</textarea>
      </div>
      <div class="admin-form-row">
        <div>
          <label>بازی مرتبط (اختیاری)</label>
          <select class="field" name="gameId">
            <option value="">-- بدون بازی مرتبط --</option>
            ${allGames.map(g=>`<option value="${g.id}" ${b.gameId==g.id?'selected':''}>${escapeHtml(g.title)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>رنگ پس‌زمینه (اگر تصویر ندارید)</label>
          <select class="field" name="gradient">
            <option value="ad-1" ${b.gradient==='ad-1'?'selected':''}>بنفش</option>
            <option value="ad-2" ${b.gradient==='ad-2'?'selected':''}>آبی</option>
            <option value="ad-3" ${b.gradient==='ad-3'?'selected':''}>نارنجی</option>
          </select>
        </div>
      </div>
      <div>
        <label>نوشته تزئینی (حرف یا کلمه کوتاه)</label>
        <input class="field" name="deco" dir="ltr" value="${escapeHtml(b.deco||'')}" placeholder="مثلاً: ER" maxlength="4">
      </div>
      <div class="admin-form-actions">
        <button type="button" class="admin-btn ghost" id="cancelBannerForm">انصراف</button>
        <button type="submit" class="admin-btn">${icon('plus')}${isEdit?'ذخیره تغییرات':'افزودن بنر'}</button>
      </div>
    </form>
  `;
  
  $('#adminModal').classList.add('open');
  
  let formImage=b.image;
  
  const bindBannerUpload=()=>{
    const up=$('#bannerUpload');
    const input=$('#bannerInput');
    up.onclick=e=>{
      if(e.target.closest('.remove-img'))return;
      input.click();
    };
    input.onchange=e=>{
      const f=e.target.files[0];
      if(!f)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        formImage=ev.target.result;
        up.classList.add('has-image');
        up.innerHTML=`<img src="${formImage}" alt="banner"><button type="button" class="remove-img" data-remove="banner">${icon('close')}</button><input type="file" accept="image/*" id="bannerInput">`;
        bindBannerUpload();
      };
      reader.readAsDataURL(f);
    };
    up.querySelectorAll('[data-remove="banner"]').forEach(btn=>{
      btn.onclick=e=>{
        e.stopPropagation();
        formImage=null;
        up.classList.remove('has-image');
        up.innerHTML=`${icon('upload')}<p>برای انتخاب تصویر بنر کلیک کنید</p><small>پیشنهاد: ابعاد 800×300 پیکسل</small><input type="file" accept="image/*" id="bannerInput">`;
        bindBannerUpload();
      };
    });
  };
  bindBannerUpload();
  
  $('#closeBannerForm').onclick=$('#cancelBannerForm').onclick=()=>$('#adminModal').classList.remove('open');
  
  $('#bannerForm').onsubmit=e=>{
    e.preventDefault();
    const d=new FormData(e.target);
    const newBanner={
      id:isEdit?b.id:('b'+Date.now()),
      title:String(d.get('title')).trim(),
      desc:String(d.get('desc')).trim(),
      gameId:d.get('gameId')?Number(d.get('gameId')):'',
      gradient:String(d.get('gradient')),
      deco:String(d.get('deco')).trim(),
      image:formImage
    };
    if(isEdit){
      const idx=state.banners.findIndex(x=>x.id===b.id);
      state.banners[idx]=newBanner;
      toast('بنر با موفقیت ویرایش شد');
    }else{
      state.banners.push(newBanner);
      toast('بنر جدید با موفقیت اضافه شد');
    }
    persist();
    $('#adminModal').classList.remove('open');
    renderAdminBanners();
  };
}

function renderAdminStats(){
  const all=getAllGames();
  const cats={};
  all.forEach(g=>{cats[g.cat]=(cats[g.cat]||0)+1});
  const years={};
  all.forEach(g=>{years[g.year]=(years[g.year]||0)+1});
  
  $('#adminContent').innerHTML=`
    <div class="admin-stats">
      <div class="admin-stat"><b>کل بازی‌ها</b><strong>${fa(all.length)}</strong></div>
      <div class="admin-stat"><b>کل بنرها</b><strong>${fa(state.banners.length)}</strong></div>
      <div class="admin-stat"><b>علاقه‌مندی کاربران</b><strong>${fa(state.favorites.length)}</strong></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="panel">
        <div class="panel-title"><h2>توزیع دسته‌بندی‌ها</h2></div>
        ${Object.entries(cats).map(([k,v])=>{
          const cat=categories.find(c=>c.id===k);
          const pct=Math.round(v/all.length*100);
          return `<div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px"><span>${cat?cat.name:k}</span><span class="muted">${fa(v)} بازی (${fa(pct)}٪)</span></div>
            <div style="height:6px;background:var(--soft);border-radius:10px;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:10px"></div></div>
          </div>`;
        }).join('')}
      </div>
      <div class="panel">
        <div class="panel-title"><h2>بازی‌ها بر اساس سال</h2></div>
        ${Object.entries(years).sort((a,b)=>b[0]-a[0]).map(([k,v])=>{
          const pct=Math.round(v/all.length*100);
          return `<div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px"><span>${fa(k)}</span><span class="muted">${fa(v)} بازی</span></div>
            <div style="height:6px;background:var(--soft);border-radius:10px;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:10px"></div></div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="panel-title"><h2>عملیات خطرناک</h2></div>
      <p style="font-size:11px;color:var(--muted);line-height:1.9;margin-bottom:14px">این عملیات‌ها قابل بازگشت نیستند. با دقت انجام دهید.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="admin-btn danger" id="resetCustomGames">${icon('trash')}حذف همه بازی‌های سفارشی</button>
        <button class="admin-btn danger" id="restoreDeleted">${icon('plus')}بازگردانی بازی‌های حذف شده</button>
        <button class="admin-btn danger" id="resetBanners">${icon('trash')}بازگردانی بنرها به حالت پیش‌فرض</button>
      </div>
    </div>
  `;
  
  $('#resetCustomGames').onclick=()=>{
    if(!confirm('آیا از حذف همه بازی‌های سفارشی مطمئن هستید؟'))return;
    state.customGames=[];
    persist();
    renderAdminStats();
    toast('همه بازی‌های سفارشی حذف شدند');
  };
  $('#restoreDeleted').onclick=()=>{
    if(!confirm('آیا می‌خواهید همه بازی‌های حذف شده را بازگردانی کنید؟'))return;
    state.deletedBaseIds=[];
    persist();
    renderAdminStats();
    toast('همه بازی‌های حذف شده بازگردانی شدند');
  };
  $('#resetBanners').onclick=()=>{
    if(!confirm('آیا می‌خواهید بنرها را به حالت پیش‌فرض بازگردانید؟'))return;
    state.banners=[...defaultBanners];
    persist();
    renderAdminStats();
    toast('بنرها به حالت پیش‌فرض بازگردانی شدند');
  };
}

$('#adminModal').addEventListener('click',e=>{
  if(e.target===$('#adminModal'))$('#adminModal').classList.remove('open');
});

window.addEventListener('hashchange',render);
render();

</script>
  <script src="/sync.js"></script>
</body>
